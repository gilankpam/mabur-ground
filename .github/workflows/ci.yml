name: CI

# Host test suite only. The cross-build (tools/build-arm64.sh) needs MPP/DRM
# roots and toolchains that live outside this repo, so it cannot run here.
# mabur comes from the third_party/mabur submodule pin; mabur's own CI builds
# this repo's master against every mabur PR.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same ref makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mabur-ground
    env:
      # run_player_e2e.sh calls `nix-shell -p ffmpeg` itself for the ffprobe /
      # libx265 gates, so <nixpkgs> has to resolve inside the TEST process, not
      # just inside the wrapper below.
      NIX_PATH: nixpkgs=channel:nixos-unstable
    steps:
      # The build wants devourer as a SIBLING directory (DEVOURER_DIR defaults
      # to ../devourer), and tests/integration/run_gs_e2e.sh imports
      # ../devourer/tools/precoder/rc_proto.py. Hence the two-checkout layout.
      # Tracking devourer's master mirrors the dev box; mabur's own
      # third_party/devourer submodule is never checked out or used.
      - uses: actions/checkout@v5
        with:
          path: mabur-ground
          # Top level only: the build reads devourer from the sibling
          # checkout below, never mabur's own third_party/devourer.
          submodules: true
      - uses: actions/checkout@v5
        with:
          repository: gilankpam/devourer
          ref: master
          path: devourer

      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDEVOURER_DIR=$GITHUB_WORKSPACE/devourer"

      - name: Build
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "cmake --build build -j$(nproc)"

      # The host suite CLAUDE.md names: the unit tests (test_) plus the
      # standing gs/player regression gates and the web parity gate, which do
      # NOT match test_. gsparam_py (6 rungs vs an expected 5) is left out.
      - name: Test
        run: |
          nix-shell -p pkg-config libusb1 --run \
            "ctest --test-dir build -R 'test_|gs_e2e|gs_au_e2e|player_e2e|web_au_parity' -j$(nproc) --output-on-failure"

      - name: Upload ctest log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ctest-log
          path: mabur-ground/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
